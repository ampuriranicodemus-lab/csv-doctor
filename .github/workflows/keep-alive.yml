name: Keep Streamlit App Awake
on:
  schedule:
    # Runs every 6 hours (at 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        run: curl -s -o /dev/null -w "%{http_code}" https://csv-doctor-for-csv-files.streamlit.app/
