name: Keep Streamlit App Awake
on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch: # Allows you to run it manually

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Install streamlit-wakeup
        run: pip install streamlit-wakeup
      - name: Wake up the app
        run: streamlit-wakeup https://csv-doctor-for-csv-files.streamlit.app/
